<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAYXA | Báo cáo vận hành</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f7f8fa; color: #101828; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #d8dde5; background: #fff; }
    .brand { font-weight: 700; letter-spacing: .02em; }
    .links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .links a { color: #175cd3; text-decoration: none; border: 1px solid #b2ccff; border-radius: 7px; padding: 7px 10px; font-size: 13px; background: #f5f8ff; }
    .links a:hover { background: #eaf2ff; }
    .report-frame { display: block; width: 100%; height: calc(100vh - 61px); min-height: 760px; border: 0; background: #f7f8fa; }
    .fallback { padding: 12px 18px; font-size: 13px; color: #667085; text-align: center; }
    @media (max-width: 640px) {
      .topbar { align-items: flex-start; flex-direction: column; padding: 10px 12px; }
      .links { justify-content: flex-start; }
      .links a { font-size: 12px; padding: 6px 8px; }
      .report-frame { height: calc(100vh - 104px); min-height: 720px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">VAYXA · Báo cáo vận hành</div>
    <nav class="links" aria-label="Liên kết vận hành">
      <a href="https://fb-ops-web-report.onrender.com/baocaofb" target="_blank" rel="noopener">Mở riêng báo cáo</a>
      <a href="https://pos.pancake.vn/" target="_blank" rel="noopener">Pancake POS</a>
      <a href="https://www.facebook.com/adsmanager/" target="_blank" rel="noopener">Meta Ads</a>
      <a href="https://dropo.io/app" target="_blank" rel="noopener">Dropo</a>
    </nav>
  </header>
  <iframe
    class="report-frame"
    src="https://fb-ops-web-report.onrender.com/baocaofb"
    title="Báo cáo vận hành đơn hàng VAYXA"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <div class="fallback">Nếu khung báo cáo chưa tải, chọn “Mở riêng báo cáo”.</div>
</body>
</html>
