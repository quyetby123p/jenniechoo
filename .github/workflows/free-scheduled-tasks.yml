      BOT3_GOOGLE_CALENDAR_IDS: ${{ secrets.BOT3_GOOGLE_CALENDAR_IDS }}
      BOT3_GMAIL_QUERY_DEFAULT: ${{ secrets.BOT3_GMAIL_QUERY_DEFAULT }}
      BOT3_SHEETS_SPREADSHEET_ID: ${{ secrets.BOT3_SHEETS_SPREADSHEET_ID }}
      BOT3_SHEETS_GID: ${{ secrets.BOT3_SHEETS_GID }}
      FB_RECONCILE_ENABLED: ${{ secrets.FB_RECONCILE_ENABLED || '0' }}
      FB_RECONCILE_SHEET_ID: ${{ secrets.FB_RECONCILE_SHEET_ID || '11CFuyMjJixR-rMQk0haoFqec8R6j45z5LG74pVX47dE' }}
      FB_RECONCILE_JC_AD_ACCOUNT_ID: ${{ secrets.FB_RECONCILE_JC_AD_ACCOUNT_ID }}
      FB_RECONCILE_VAYXA_AD_ACCOUNT_ID: ${{ secrets.FB_RECONCILE_VAYXA_AD_ACCOUNT_ID }}
      FB_RECONCILE_CARD_LAST4: ${{ secrets.FB_RECONCILE_CARD_LAST4 || '3036' }}
      FB_RECONCILE_DATE_WINDOW_DAYS: ${{ secrets.FB_RECONCILE_DATE_WINDOW_DAYS || '7' }}
      FB_RECONCILE_ROUNDING_TOLERANCE: ${{ secrets.FB_RECONCILE_ROUNDING_TOLERANCE || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore runtime state
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            storage/jobs
            storage/pending_requests
            storage/pancake_td_sync
            storage/thai_duong_auth
            storage/reports
            storage/reconcile_cod
            storage/assistant_bot
            storage/ads2
          key: ops-state-${{ github.run_id }}
          restore-keys: |
            ops-state-

      - name: Resolve task
        id: task
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "task=skip" >> "$GITHUB_OUTPUT"
            echo "Unsupported event '${{ github.event_name }}'; native GitHub schedule is disabled."
            exit 0
          fi
          echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          echo "media_codes=${{ inputs.media_codes }}" >> "$GITHUB_OUTPUT"
          echo "media_days=${{ inputs.media_days }}" >> "$GITHUB_OUTPUT"
          echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          echo "pancake_notify=${{ inputs.pancake_notify }}" >> "$GITHUB_OUTPUT"
          echo "order_code=${{ inputs.order_code }}" >> "$GITHUB_OUTPUT"
          echo "source=${{ inputs.source }}" >> "$GITHUB_OUTPUT"
          echo "bot=${{ inputs.bot }}" >> "$GITHUB_OUTPUT"

      - name: Check minimum secrets
        shell: bash
        run: |
          missing=()
          task="${{ steps.task.outputs.task }}"
          bot="${{ steps.task.outputs.bot || 'main' }}"
          profile="${{ steps.task.outputs.profile || 'main' }}"
          if [ "$task" = "telegram-update" ] && [ "$bot" = "ads2" ]; then
            profile="ads2"
          fi
          if [ "$task" = "media-performance" ]; then
            profile="ads2"
          fi
          if [ "$profile" = "ads2" ]; then
            for key in ADS2_TELEGRAM_BOT_TOKEN ADS2_TELEGRAM_ALLOWED_USER_ID ADS2_META_AD_ACCOUNT_ID ADS2_META_PAGE_ID; do
              if [ -z "${!key}" ]; then
                missing+=("$key")
              fi
            done
          else
            for key in TELEGRAM_BOT_TOKEN TELEGRAM_ALLOWED_USER_ID META_ACCESS_TOKEN META_AD_ACCOUNT_ID META_PAGE_ID; do
              if [ -z "${!key}" ]; then
                missing+=("$key")
              fi
            done
          fi
          if [ "$task" = "daily-report" ] && [ "$profile" = "ads2" ]; then
            if [ -z "$ADS2_PANCAKE_ACCESS_TOKEN" ] && [ -z "$ADS2_PANCAKE_API_KEY" ] && [ -z "$PANCAKE_ACCESS_TOKEN" ] && [ -z "$PANCAKE_API_KEY" ]; then
              missing+=("ADS2_PANCAKE_ACCESS_TOKEN or ADS2_PANCAKE_API_KEY")
            fi
            if [ -z "$ADS2_PANCAKE_SHOP_ID" ]; then
              missing+=("ADS2_PANCAKE_SHOP_ID")
            fi
            if [ -z "$ADS2_DAILY_REPORT_NOTIFY_CHAT_ID" ] && [ -z "$DAILY_REPORT_NOTIFY_CHAT_ID" ]; then
              missing+=("ADS2_DAILY_REPORT_NOTIFY_CHAT_ID or DAILY_REPORT_NOTIFY_CHAT_ID")
            fi
          elif [ "$task" = "daily-report" ]; then
            if [ -z "$PANCAKE_ACCESS_TOKEN" ] && [ -z "$PANCAKE_API_KEY" ]; then
              missing+=("PANCAKE_ACCESS_TOKEN or PANCAKE_API_KEY")
            fi
            if [ -z "$PANCAKE_SHOP_ID" ]; then
              missing+=("PANCAKE_SHOP_ID")
            fi
          elif [ "$task" = "pancake-td-sync" ] && [ "$profile" = "ads2" ]; then
            if [ -z "$ADS2_PANCAKE_ACCESS_TOKEN" ] && [ -z "$ADS2_PANCAKE_API_KEY" ] && [ -z "$PANCAKE_ACCESS_TOKEN" ] && [ -z "$PANCAKE_API_KEY" ]; then
              missing+=("ADS2_PANCAKE_ACCESS_TOKEN or ADS2_PANCAKE_API_KEY")
            fi
            if [ -z "$ADS2_PANCAKE_SHOP_ID" ]; then
              missing+=("ADS2_PANCAKE_SHOP_ID")
            fi
          elif [ "$task" = "media-performance" ] && [ "$profile" = "ads2" ]; then
            if [ -z "$ADS2_META_ACCESS_TOKEN" ] && [ -z "$META_ACCESS_TOKEN" ]; then
              missing+=("ADS2_META_ACCESS_TOKEN or META_ACCESS_TOKEN")
            fi
            if [ "$ADS2_MEDIA_ANALYTICS_SHEET_ENABLED" != "0" ]; then
              for key in ADS2_MEDIA_ANALYTICS_SHEET_SPREADSHEET_ID ADS2_MEDIA_ANALYTICS_SHEET_GID ADS2_MEDIA_ANALYTICS_SHEET_OAUTH_CLIENT_ID ADS2_MEDIA_ANALYTICS_SHEET_OAUTH_CLIENT_SECRET ADS2_MEDIA_ANALYTICS_SHEET_OAUTH_REFRESH_TOKEN; do
                if [ -z "${!key}" ]; then
                  missing+=("$key")
                fi
              done
            fi
          elif [ "$task" = "pancake-td-sync" ]; then
            if [ -z "$PANCAKE_ACCESS_TOKEN" ] && [ -z "$PANCAKE_API_KEY" ]; then
              missing+=("PANCAKE_ACCESS_TOKEN or PANCAKE_API_KEY")
            fi
            if [ -z "$PANCAKE_SHOP_ID" ]; then
              missing+=("PANCAKE_SHOP_ID")
            fi
          fi
          if [ "$task" = "bot3-daily-checkin" ] || { [ "$task" = "telegram-update" ] && [ "$bot" = "bot3" ]; }; then
            for key in BOT3_TELEGRAM_TOKEN BOT3_ALLOWED_USER_ID; do
              if [ -z "${!key}" ]; then
                missing+=("$key")
              fi
            done
          fi
          if [ "$task" = "telegram-update" ] && [ "$bot" = "ads2" ]; then
            for key in ADS2_TELEGRAM_BOT_TOKEN ADS2_META_PAGE_ACCESS_TOKEN ADS2_META_AD_ACCOUNT_ID ADS2_META_PAGE_ID; do
              if [ -z "${!key}" ]; then
                missing+=("$key")
              fi
            done
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Run scheduled task
        shell: bash
        run: |
          task="${{ steps.task.outputs.task }}"
          if [ "$task" = "skip" ]; then
            echo "Skipping unsupported non-dispatch event."
            exit 0
          fi
          args=("$task")
          if [ "$task" = "daily-report" ]; then
            args+=("--slot" "${{ steps.task.outputs.slot || 'morning' }}")
            if [ -n "${{ steps.task.outputs.date }}" ]; then
              args+=("--date" "${{ steps.task.outputs.date }}")
            fi
          fi
          if [ "$task" = "reconcile-cash-in" ] && [ -n "${{ steps.task.outputs.date }}" ]; then
            args+=("--date" "${{ steps.task.outputs.date }}")
            if [ -n "${{ steps.task.outputs.source }}" ]; then
              args+=("--source" "${{ steps.task.outputs.source }}")
            fi
          fi
          if [ "$task" = "media-performance" ]; then
            if [ -n "${{ steps.task.outputs.media_codes }}" ]; then
              args+=("--codes" "${{ steps.task.outputs.media_codes }}")
            fi
            if [ -n "${{ steps.task.outputs.media_days }}" ]; then
              args+=("--days" "${{ steps.task.outputs.media_days }}")
            fi
          fi
          if [ "$task" = "bot3-daily-checkin" ]; then
            args+=("--slot" "${{ steps.task.outputs.slot || 'morning' }}")
            if [ -n "${{ steps.task.outputs.date }}" ]; then
              args+=("--date" "${{ steps.task.outputs.date }}")
            fi
          fi
          if [ "$task" = "pancake-td-sync" ]; then
            args+=("--notify" "${{ steps.task.outputs.pancake_notify || 'auto' }}")
            if [ -n "${{ steps.task.outputs.order_code }}" ]; then
              args+=("--order-code" "${{ steps.task.outputs.order_code }}")
            fi
          fi
          if [ "$task" = "telegram-update" ]; then
            python -c 'import json, os, sys; event=json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")); update_b64=(event.get("inputs") or {}).get("update_b64", ""); sys.exit("Missing update_b64 for telegram-update.") if not update_b64 else open("telegram_update.b64", "w", encoding="utf-8").write(update_b64)'
            python -m app.telegram_update_runner --bot "${{ steps.task.outputs.bot || 'main' }}" --update-b64-file telegram_update.b64
          else
            profile="${{ steps.task.outputs.profile || 'main' }}"
            if [ "$task" = "media-performance" ]; then
              profile="ads2"
            fi
            python -m app.scheduled_tasks --profile "$profile" "${args[@]}"
          fi

      - name: Publish Bot 3 task snapshot
        if: always() && (steps.task.outputs.task == 'bot3-daily-checkin' || (steps.task.outputs.task == 'telegram-update' && steps.task.outputs.bot == 'bot3'))
        env:
          BOT3_TASK_SNAPSHOT_GITHUB_REPO: ${{ github.repository }}
          BOT3_TASK_SNAPSHOT_GITHUB_TOKEN: ${{ github.token }}
          BOT3_TASK_SNAPSHOT_VARIABLE_NAME: ${{ vars.BOT3_TASK_SNAPSHOT_VARIABLE_NAME || 'BOT3_TASK_SNAPSHOT' }}
        run: python -m app.assistant_task_snapshot publish

      - name: Save runtime state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state
            storage/jobs
            storage/pending_requests
            storage/pancake_td_sync
            storage/thai_duong_auth
            storage/reports
            storage/reconcile_cod
            storage/assistant_bot
            storage/ads2
          key: ops-state-${{ github.run_id }}

