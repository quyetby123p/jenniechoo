name: free scheduled tasks

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        # Safety default: a malformed cron dispatch must never become a
        # repeated token-health notification. The Worker normally always
        # supplies the explicit task value.
        default: "pancake-td-sync"
        type: choice
        options:
          - token-health
          - daily-report
          - media-performance
          - reconcile-cash-in
          - reconcile-weekly
          - pancake-td-sync
          - telegram-update
          - bot3-daily-checkin
      slot:
        description: "Daily report slot"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening
      date:
        description: "Optional report date YYYY-MM-DD"
        required: false
        default: ""
      media_codes:
        description: "Optional comma-separated VXV codes for media-performance"
        required: false
        default: ""
      media_days:
        description: "Optional lookback days for media-performance"
        required: false
        default: ""
      profile:
        description: "Ads profile for scheduled task"
        required: false
        default: "main"
        type: choice
        options:
          - main
          - ads2
      pancake_notify:
        description: "Pancake sync notification mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - always
      order_code:
        description: "Optional Pancake order code for pancake-td-sync canary"
        required: false
        default: ""
      update_b64:
        description: "Base64 Telegram update JSON for cloud webhook dispatch"
        required: false
        default: ""
      source:
        description: "Optional dispatch source label"
        required: false
        default: ""
      bot:
        description: "Telegram bot to process webhook updates"
        required: false
        default: "main"
        type: choice
        options:
          - main
          - ads2
          - bot3

concurrency:
  group: free-scheduled-tasks
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_TIMEZONE: ${{ secrets.APP_TIMEZONE || 'Asia/Ho_Chi_Minh' }}
      APP_CURRENCY: ${{ secrets.APP_CURRENCY || 'VND' }}
      APP_RETRY_MAX: ${{ secrets.APP_RETRY_MAX }}
      APP_RETRY_BACKOFF: ${{ secrets.APP_RETRY_BACKOFF }}
      TOKEN_HEALTHCHECK_ENABLED: ${{ secrets.TOKEN_HEALTHCHECK_ENABLED }}
